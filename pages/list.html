<!DOCTYPE html>
<html lang="uk" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentence Mixer — Список</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='orangeGrad' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23fb923c'/%3E%3Cstop offset='50%25' stop-color='%23f97316'/%3E%3Cstop offset='100%25' stop-color='%23ea580c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='5' y='5' width='54' height='54' rx='12' fill='%23ffffff' stroke='url(%23orangeGrad)' stroke-width='4'/%3E%3Cpath d='M45 7h10v10' fill='none' stroke='url(%23orangeGrad)' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 23h12' stroke='%232563eb' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M18 32h20' stroke='%232563eb' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M18 41h28' stroke='%232563eb' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/list.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <nav id="navbar">
    <ul></ul>
  </nav>

  <div class="list-page">
    <header class="list-header">
      <h1>Список речень</h1>
      <div class="controls">
        <button id="toggleLanguage" class="btn">Show Ukrainian</button>
        <div class="search-container">
          <input type="text" id="searchInput" placeholder="Пошук речень..." autocomplete="off">
          <div id="searchModal" class="modal">
            <div class="modal-content">
              <ul id="searchResults" class="search-results"></ul>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <ul id="sentencesList" class="sentences-list"></ul>
    </main>
  </div>

  <!-- Translation Modal -->
  <div id="translationModal" class="modal">
    <div class="modal-content">
      <div class="translation-container">
        <div class="translation-text-container">
          <p id="translationText"></p>
          <div id="translationExampleText" class="example-text"></div>
        </div>
        <button id="voiceBtn" class="voice-btn" title="Проголосити">
          <div class="speaker-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
          </div>
        </button>
      </div>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/voiceEngine.js"></script>
  <script src="../js/list.js"></script>
</body>

</html>
