<!DOCTYPE html>
<html lang="uk" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentence Mixer — Список</title>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><rect x='6' y='6' width='52' height='52' rx='6' ry='6' fill='%23ffffff' stroke='%23111827' stroke-width='3'/><path d='M46 6 L58 6 L58 18' fill='none' stroke='%23111827' stroke-width='2'/><rect x='14' y='20' width='36' height='3' rx='1.5' fill='%23111827'/><rect x='14' y='28' width='30' height='3' rx='1.5' fill='%23111827'/><rect x='14' y='36' width='24' height='3' rx='1.5' fill='%23111827'/></svg>" type="image/svg+xml">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/list.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <nav id="navbar">
    <ul></ul>
  </nav>

  <div class="list-page">
    <header class="list-header">
      <h1>Список речень</h1>
      <div class="controls">
        <button id="toggleLanguage" class="btn">Show Ukrainian</button>
        <div class="search-container">
          <input type="text" id="searchInput" placeholder="Пошук речень..." autocomplete="off">
          <div id="searchModal" class="modal">
            <div class="modal-content">
              <ul id="searchResults" class="search-results"></ul>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <ul id="sentencesList" class="sentences-list"></ul>
    </main>
  </div>

  <!-- Translation Modal -->
  <div id="translationModal" class="modal">
    <div class="modal-content">
      <div class="translation-container">
        <div class="translation-text-container">
          <p id="translationText"></p>
          <div id="translationExampleText" class="example-text"></div>
        </div>
        <button id="voiceBtn" class="voice-btn" title="Проголосити">
          <div class="speaker-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
          </div>
        </button>
      </div>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/voiceEngine.js"></script>
  <script src="../js/list.js"></script>
</body>

</html>
